# @package _global_
defaults:
  - /exp/manager/universal_token/all_modes/sonic_v1_1
  - override /aux_losses: universal_token/root_latent
  - _self_

checkpoint: sonic_v1_1/last.pt

manager_env:
  config:
    root_latent_actions: true
  commands:
    motion:
      encoder_sample_probs:
        g1: 1.0
        teleop: 0.0
        smpl: 0.0
      motion_lib_cfg:
        smpl_motion_file: dummy
  observations:
    tokenizer:
      motion_root_trajectory_heading:
        _target_: isaaclab.managers.ObservationTermCfg
        func: gear_sonic.envs.manager_env.mdp:motion_root_trajectory_heading
        params:
          command_name: motion
  rewards:
    root_meta_action_rate:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:root_meta_action_rate
      weight: -0.1
    root_full_token_rate:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:root_full_token_rate
      weight: -0.01
    tracking_anchor_xy:
      _target_: isaaclab.managers.RewardTermCfg
      func: gear_sonic.envs.manager_env.mdp:tracking_anchor_pos_error
      weight: 0.5
      params:
        command_name: motion
        std: 0.1
        xy_only: true

algo:
  config:
    freeze_noise_std: false
    policy_action_dim: 64
    init_noise_std: 0.05
    base_policy_diagnostic_samples: 256
    checkpoint_new_actor_modules: [actor_module.encoders.root]
    actor:
      output_original_obs_dict: true
      backbone:
        _target_: gear_sonic.trl.modules.root_latent_policy.RootLatentPolicy
        residual_scale: 0.1
        residual_l2_coef: 0.1
        dt_future_ref_frames: ${manager_env.commands.motion.dt_future_ref_frames}
        reencode_smpl_g1_recon: false
        freeze_decoders: true
        freeze_quantizer: true
        encoders:
          g1:
            freeze: true
          teleop:
            freeze: true
          smpl:
            freeze: true
          root:
            additive_to: g1
            condition_on_base_latent: true
            inputs: [motion_root_trajectory_heading]
            params:
              _target_: gear_sonic.trl.modules.base_module.BaseModule
              input_dim:
              output_dim:
              num_input_temporal_dims: null
              num_output_temporal_dims: ${algo.config.actor.backbone.max_num_tokens}
              module_config_dict:
                layer_config:
                  type: MLP
                  hidden_dims: [512, 256, 128]
                  activation: SiLU
                  output_layer_norm: false
